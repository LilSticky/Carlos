name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # A green main becomes one new commit on `deploy`. The Wispbyte server pulls that branch on every start
  # (Auto Update), runs npm install and starts dist/main.js. Same approach as Neil.
  deploy:
    if: github.event_name == 'push'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # No install scripts while this job holds a write token. tsc needs none.
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Assemble the deploy commit on top of origin/deploy
        run: |
          git worktree add --detach out
          if git fetch --no-tags origin deploy; then
            (cd out && git checkout --detach origin/deploy)
          else
            (cd out && git checkout --orphan deploy-new)
          fi
          find out -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r dist guide package-lock.json out/
          # Runtime dependencies only. The host's npm install fetches sharp's prebuilt Linux binary.
          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            delete pkg.devDependencies;
            pkg.scripts = { start: pkg.scripts.start };
            fs.writeFileSync("out/package.json", JSON.stringify(pkg, null, 2) + "\n");
            fs.writeFileSync("out/build-info.json", JSON.stringify({
              version: process.env.GITHUB_SHA.slice(0, 7),
              builtAt: new Date().toISOString(),
            }) + "\n");
          '
          printf 'node_modules/\ndata/\n.env\n.env.*\n' > out/.gitignore
          # Prune the lockfile to match, so npm install on the host leaves it unchanged and git pull keeps working.
          (cd out && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)
      - name: Commit and push (never force)
        working-directory: out
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: ${GITHUB_SHA::7}"
          git push origin "HEAD:refs/heads/deploy"
